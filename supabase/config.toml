project_id = "bfallxtcxxyykcnkedom"

[auth]
site_url = "https://inkmarkt-dev.netlify.app"
additional_redirect_urls = ["https://inkmarkt-dev.netlify.app/"]
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"
# Leaked-password protection is a hosted Pro setting enabled in the Supabase Dashboard.

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[storage.vector]
enabled = false

[functions.ai-bookmate]
enabled = true
verify_jwt = true
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ai-bookmate/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ai-bookmate/*.html" ]
