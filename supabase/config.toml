project_id = "bfallxtcxxyykcnkedom"

[auth]
site_url = "https://inkmarkt-dev.netlify.app"
# exp:// entries let the emailed recovery link deep-link back into Expo Go
# during Stage 2 device testing; bookmarkt:// covers future standalone builds.
additional_redirect_urls = [
  "https://inkmarkt-dev.netlify.app/",
  "exp://192.168.1.143:8081",
  "exp://192.168.1.143:8081/--/reset-password",
  "exp://192.168.1.143:8081/--/*",
  "bookmarkt://reset-password",
  "bookmarkt://*",
]
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"
# Leaked-password protection is a hosted Pro setting enabled in the Supabase Dashboard.

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8
# NOTE: custom email templates require a paid plan or custom SMTP; the
# recovery flow therefore uses the default link email + deep-link redirect.

[storage.vector]
enabled = false

[functions.ai-bookmate]
enabled = true
verify_jwt = true
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ai-bookmate/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ai-bookmate/*.html" ]

[functions.companion]
enabled = true
verify_jwt = true
entrypoint = "./functions/companion/index.ts"

# RevenueCat calls this server-to-server with its own shared-secret
# Authorization header (checked inside the function), not a Supabase JWT.
[functions.revenuecat-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/revenuecat-webhook/index.ts"
